<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Спасибо! — Буквица</title>
  <link rel="icon" href="az.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf7f2;
      font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
      color: #3a2c1e;
    }
    .thank-you {
      max-width: 560px;
      padding: 3rem 2rem;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(90, 74, 58, .12);
      margin: 1rem;
    }
    .thank-you h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 0 0 1rem;
      color: #8b5a2b;
    }
    .thank-you p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 0 0 2rem;
      color: #5a4a3a;
    }
    .thank-you a {
      display: inline-block;
      padding: .85em 1.8em;
      background: #8b5a2b;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background .2s;
    }
    .thank-you a:hover { background: #6b4319; }
  </style>
</head>
<body>
  <div class="thank-you">
    <h1>Спасибо!</h1>
    <p>Ваше сообщение отправлено. Мы ответим на указанный email в ближайшее время.</p>
    <a href="index.html">← Вернуться на главную</a>
  </div>
</body>
</html>
