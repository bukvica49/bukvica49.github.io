<form id="feedbackForm" action="https://formsubmit.co/25online@mail.ru" method="POST">

  <!-- Служебные поля FormSubmit — на дизайн не влияют, не отображаются -->
  <input type="hidden" name="_subject" value="Сообщение с сайта bukvica49.github.io">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="true">

  <div class="form-group">
    <label for="name">Имя *</label>
    <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
  </div>

  <div class="form-group">
    <label for="email">Email *</label>
    <input type="email" id="email" name="email" required placeholder="Введите ваш email">
  </div>

  <div class="form-group">
    <label for="subject">Тема</label>
    <select id="subject" name="subject">
      <option value="">Выберите тему</option>
      <option value="Вопрос по проекту">Вопрос по проекту</option>
      <option value="Сотрудничество">Сотрудничество</option>
      <option value="Другое">Другое</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message">Сообщение *</label>
    <textarea id="message" name="message" required placeholder="Опишите ваш вопрос или предложение..." rows="5"></textarea>
  </div>

  <button type="submit" class="submit-btn">
    <i class="fas fa-paper-plane"></i> Отправить сообщение
  </button>
  <p class="form-note">* — обязательные для заполнения поля</p>
